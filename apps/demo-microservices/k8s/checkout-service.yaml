# checkout-service: the second real workload. It runs the same instrumented demo
# app as payment-service (image built from apps/demo-microservices/payment-service
# and tagged nexus/checkout-service:v1); every POST /checkout calls payment-service,
# so a payment problem genuinely reaches its caller. Registered in
# config/services.yaml with depends_on: [payment-service].
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: nexus-demo
  labels:
    app: checkout-service
    service_name: checkout-service
  annotations:
    nexus.io/version: "v1"
    nexus.io/previous-version: "v1"
    nexus.io/commit-sha: "baseline"
    nexus.io/pipeline-id: "bootstrap"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
        service_name: checkout-service
        version: v1
        environment: development
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: checkout-service
          image: nexus/checkout-service:v1
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "checkout-service"
            - name: VERSION
              value: "v1"
            - name: ENVIRONMENT
              value: "development"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DOWNSTREAM_PAY_URL
              value: "http://payment-service/pay"
            # A light front service: payment-service does the heavy work, so a checkout
            # surge becomes a payment overload (the dependency-guard scenario).
            - name: PAYMENT_WORK_ITERATIONS
              value: "1000"
            - name: PAYMENT_MAX_CONCURRENCY
              value: "8"
            - name: CPU_LIMIT_CORES
              value: "0.5"
            - name: MEMORY_LIMIT_BYTES
              value: "536870912"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: nexus-demo
  labels:
    service_name: checkout-service
spec:
  selector:
    app: checkout-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
