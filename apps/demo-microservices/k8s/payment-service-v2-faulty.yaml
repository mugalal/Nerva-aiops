# Faulty v2 overlay for Scenario A (bad deployment).
# Apply AFTER healthy v1 is running:
#   kubectl apply -f payment-service-v2-faulty.yaml
# Roll back (M4):
#   kubectl rollout undo deployment/payment-service -n nexus-demo
#   # or: kubectl apply -f payment-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: nexus-demo
  labels:
    app: payment-service
    service_name: payment-service
  annotations:
    nexus.io/version: "v2"
    nexus.io/previous-version: "v1"
    nexus.io/commit-sha: "faulty-v2"
    nexus.io/pipeline-id: "scenario-a"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        service_name: payment-service
        version: v2
        environment: development
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: payment-service
          image: nexus/payment-service:v2
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "payment-service"
            - name: VERSION
              value: "v2"
            - name: ENVIRONMENT
              value: "development"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CPU_LIMIT_CORES
              value: "0.5"
            - name: MEMORY_LIMIT_BYTES
              value: "536870912"
            - name: FAULT_LATENCY_MS
              value: "600"
            - name: FAULT_5XX_RATE
              value: "0.14"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
