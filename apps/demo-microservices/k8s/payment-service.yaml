apiVersion: v1
kind: Namespace
metadata:
  name: nexus-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: nexus-demo
  labels:
    app: payment-service
    service_name: payment-service
  annotations:
    nexus.io/version: "v1"
    nexus.io/previous-version: "v1"
    nexus.io/commit-sha: "baseline"
    nexus.io/pipeline-id: "bootstrap"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        service_name: payment-service
        version: v1
        environment: development
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: payment-service
          image: nexus/payment-service:v1  # M4 rollback target; faulty demo uses :v2
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: "payment-service"
            - name: VERSION
              value: "v1"
            - name: ENVIRONMENT
              value: "development"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CPU_LIMIT_CORES
              value: "0.5"
            - name: MEMORY_LIMIT_BYTES
              value: "536870912"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: nexus-demo
  labels:
    service_name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
