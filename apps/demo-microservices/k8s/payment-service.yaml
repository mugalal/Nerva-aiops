apiVersion: v1
kind: Namespace
metadata:
  name: nexus-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: nexus-demo
  labels:
    app: payment-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: nexus/payment-service:v1  # M4 rollback target; faulty demo uses :v2
          ports:
            - containerPort: 8000
          env:
            - name: VERSION
              value: "v1"
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: nexus-demo
spec:
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 8000
