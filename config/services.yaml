# NEXUS service registry: the remediation policy enforced by M4 and M6.
# Semantics and loading rules: shared/registry.py.
#
# Only payment-service is listed because it is the only workload in this
# repository that M1 scrapes and that runs as a Kubernetes Deployment.
# Adding an entry grants guardrails; it does not create telemetry or an
# actuator. See config/services.multi-example.yaml for the multi-service shape.
version: 1
services:
  - name: payment-service
    namespace: nexus-demo
    workload:
      kind: Deployment
      name: payment-service
    tier: critical          # informational only
    depends_on: []          # M4 will not scale this service while a dependency has an open incident
    remediation:
      actions: [ROLLBACK, SCALE]
      min_replicas: 1
      max_replicas: 10
      max_scale_step: 7
      approval: always
