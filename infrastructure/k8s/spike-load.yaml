apiVersion: v1
kind: Pod
metadata:
  name: payment-spike-load
  namespace: nexus-demo
  labels:
    app: payment-traffic
    service_name: payment-traffic
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 45
  containers:
    - name: traffic
      image: nexus/payment-service:v1
      imagePullPolicy: IfNotPresent
      command: [python, /traffic/k8s-traffic.py]
      env:
        - name: TARGET_URL
          value: http://payment-service/pay
        - name: RPS
          value: "150"
        - name: DURATION_SECONDS
          value: "1800"
        - name: MAX_IN_FLIGHT
          value: "500"
        - name: REQUEST_TIMEOUT_SECONDS
          value: "10"
        - name: REPORT_INTERVAL_SECONDS
          value: "10"
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 384Mi
      volumeMounts:
        - name: script
          mountPath: /traffic
          readOnly: true
  volumes:
    - name: script
      configMap:
        name: payment-traffic-script
