services:
  payment-service:
    build:
      context: ../apps/demo-microservices/payment-service
      args:
        VERSION: v1
    image: nexus/payment-service:v1
    container_name: nexus-payment-service
    cpus: 1.0
    mem_limit: 512m
    environment:
      SERVICE_NAME: payment-service
      VERSION: v1
      ENVIRONMENT: development
      NAMESPACE: nexus-demo
      CPU_LIMIT_CORES: "1"
      MEMORY_LIMIT_BYTES: "536870912"
    ports:
      - "8000:8000"
    restart: unless-stopped

  root-cause-analysis:
    profiles: [integration]
    build:
      context: ..
      dockerfile: services/root-cause-analysis/Dockerfile
    image: nexus/root-cause-analysis:dev
    environment:
      M3_PROVIDER_MODE: real
      SHARED_NEXUS_API_BASE_URL: http://shared-nexus-api:8004
      M1_TELEMETRY_BASE_URL: http://telemetry-intelligence:8001
    ports:
      - "8003:8003"
    cpus: 0.25
    mem_limit: 256m
    depends_on:
      - telemetry-intelligence
    restart: unless-stopped

  finops-engine:
    profiles: [integration]
    build:
      context: ..
      dockerfile: services/finops-engine/Dockerfile
    image: nexus/finops-engine:dev
    environment:
      SERVICE_NAME: finops-engine
      M1_TELEMETRY_BASE_URL: http://telemetry-intelligence:8001
      # Compose has no Kubernetes requests; these are explicit demo sizing inputs.
      FINOPS_CPU_REQUEST_M: "100"
      FINOPS_CPU_LIMIT_M: "1000"
      FINOPS_MEMORY_REQUEST_MB: "128"
      FINOPS_MEMORY_LIMIT_MB: "512"
    ports:
      - "8006:8006"
    cpus: 0.25
    mem_limit: 256m
    depends_on:
      - telemetry-intelligence
    restart: unless-stopped

  shared-nexus-api:
    profiles: [integration]
    build:
      context: ..
      dockerfile: services/shared-nexus-api/Dockerfile
    image: nexus/shared-nexus-api:dev
    environment:
      RCA_PROVIDER: real
      FINOPS_PROVIDER: real
      RECOVERY_PROVIDER: real
      EVIDENCE_PROVIDER: real
      M3_RCA_URL: http://root-cause-analysis:8003/internal/rca/analyze
      M6_FINOPS_URL: http://finops-engine:8006/internal/finops/context
      M1_EVIDENCE_URL: http://telemetry-intelligence:8001/internal/evidence/capture
      M1_RECOVERY_URL: http://telemetry-intelligence:8001/internal/recovery/validate
      # Real data providers; opt-in actuator configuration is separate.
      REMEDIATION_BACKEND: "${REMEDIATION_BACKEND:-mock}"
    ports:
      - "8004:8004"
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      - root-cause-analysis
      - finops-engine
    restart: unless-stopped

  telemetry-intelligence:
    build:
      context: ..
      dockerfile: services/telemetry-intelligence/Dockerfile
    image: nexus/telemetry-intelligence:dev
    container_name: nexus-telemetry-intelligence
    environment:
      SERVICE_NAME: telemetry-intelligence
      SERVICE_VERSION: 0.1.0
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      M1_PROVIDER_MODE: real
      PROMETHEUS_BASE_URL: http://prometheus:9090
      LOKI_BASE_URL: http://loki:3100
      PAYMENT_SERVICE_BASE_URL: http://payment-service:8000
      M1_DATA_DIR: /data
      M1_LATENCY_WINDOW: 1m
    ports:
      - "8001:8001"
    volumes:
      - "m1-data:/data"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nexus-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus-data:/prometheus"
    depends_on:
      - payment-service
      - telemetry-intelligence
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: nexus-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - "grafana-data:/var/lib/grafana"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: nexus-loki
    command: "-config.file=/etc/loki/local-config.yaml"
    ports:
      - "3100:3100"
    volumes:
      - "loki-data:/tmp/loki"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: nexus-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - "./alloy/config.alloy:/etc/alloy/config.alloy:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "alloy-data:/var/lib/alloy/data"
    depends_on:
      - loki
    restart: unless-stopped

  anomaly-engine:
    profiles: [integration]
    build:
      context: ..
      dockerfile: services/anomaly-engine/Dockerfile
    image: nexus/anomaly-engine:dev
    environment:
      SERVICE_NAME: anomaly-engine
      ENVIRONMENT: development
      M2_POLL_ENABLED: "true"
      M2_HANDOFF_ENABLED: "true"
      M2_HANDOFF_URL: http://shared-nexus-api:8004
      M1_TELEMETRY_BASE_URL: http://telemetry-intelligence:8001
    ports:
      - "8002:8002"
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

  incident-memory:
    profiles: [integration]
    build:
      context: ..
      dockerfile: services/incident-memory/Dockerfile
    image: nexus/incident-memory:dev
    environment:
      SERVICE_NAME: incident-memory
      ENVIRONMENT: development
      DATABASE_URL: sqlite:////data/memory.db
      M5_UI_MODE: live
      SHARED_NEXUS_API_BASE_URL: http://shared-nexus-api:8004
      M5_APPROVAL_PATH: /api/incidents/{incident_id}/approve
      M5_SHARED_API_TOKEN: ${NEXUS_APPROVAL_TOKEN:-secret-demo-token}
    ports:
      - "8005:8005"
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - "m5-data:/data"
    restart: unless-stopped

volumes:
  alloy-data:
  grafana-data:
  loki-data:
  m1-data:
  m5-data:
  prometheus-data:
