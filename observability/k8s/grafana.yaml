apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: nexus-demo
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: nexus-demo
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: NEXUS
        folder: NEXUS
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-m1
  namespace: nexus-demo
data:
  nexus-m1-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum(rate(nexus_http_requests_total{service_name=\"payment-service\",route=\"/pay\"}[1m]))", "legendFormat": "requests", "refId": "A"}],
          "title": "Request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ms"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(nexus_http_request_duration_seconds_bucket{service_name=\"payment-service\",route=\"/pay\"}[1m]))) * 1000", "legendFormat": "p95", "refId": "A"}],
          "title": "P95 latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "100 * ((sum(rate(nexus_http_requests_total{service_name=\"payment-service\",route=\"/pay\",status_code=~\"5..\"}[1m])) or vector(0)) / clamp_min(sum(rate(nexus_http_requests_total{service_name=\"payment-service\",route=\"/pay\"}[1m])), 0.000001))", "legendFormat": "5xx", "refId": "A"}],
          "title": "HTTP 5xx rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "targets": [{"expr": "100 * sum(rate(process_cpu_seconds_total{service_name=\"payment-service\"}[1m])) / clamp_min(sum(nexus_resource_limit_cpu_cores{service_name=\"payment-service\"}), 0.001)", "legendFormat": "CPU", "refId": "A"}],
          "title": "CPU utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "targets": [{"expr": "100 * sum(process_resident_memory_bytes{service_name=\"payment-service\"}) / clamp_min(sum(nexus_resource_limit_memory_bytes{service_name=\"payment-service\"}), 1)", "legendFormat": "memory", "refId": "A"}],
          "title": "Memory utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0, "min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "count(nexus_service_info{service_name=\"payment-service\"})", "legendFormat": "replicas", "refId": "A"}],
          "title": "Replica count",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 24},
          "id": 7,
          "title": "checkout-service (calls payment-service) and CPU throttling",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 25},
          "id": 8,
          "targets": [
            {"expr": "sum(rate(nexus_http_requests_total{service_name=\"checkout-service\",route=\"/checkout\"}[1m]))", "legendFormat": "checkout requests", "refId": "A"},
            {"expr": "sum(rate(nexus_http_requests_total{service_name=\"payment-service\",route=\"/pay\"}[1m]))", "legendFormat": "payment requests", "refId": "B"}
          ],
          "title": "Request rate: checkout and payment",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ms"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 25},
          "id": 9,
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(nexus_http_request_duration_seconds_bucket{service_name=\"checkout-service\",route=\"/checkout\"}[1m]))) * 1000", "legendFormat": "checkout p95", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(nexus_http_request_duration_seconds_bucket{service_name=\"payment-service\",route=\"/pay\"}[1m]))) * 1000", "legendFormat": "payment p95", "refId": "B"}
          ],
          "title": "P95 latency: checkout and payment",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "Share of CFS periods in which the container's CPU limit throttled it (from each pod's own cgroup cpu.stat).",
          "fieldConfig": {"defaults": {"max": 100, "min": 0, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 33},
          "id": 10,
          "targets": [
            {"expr": "100 * sum(rate(nexus_cpu_cfs_throttled_periods_total{service_name=\"payment-service\"}[1m])) / clamp_min(sum(rate(nexus_cpu_cfs_periods_total{service_name=\"payment-service\"}[1m])), 0.000001)", "legendFormat": "payment throttled", "refId": "A"},
            {"expr": "100 * sum(rate(nexus_cpu_cfs_throttled_periods_total{service_name=\"checkout-service\"}[1m])) / clamp_min(sum(rate(nexus_cpu_cfs_periods_total{service_name=\"checkout-service\"}[1m])), 0.000001)", "legendFormat": "checkout throttled", "refId": "B"}
          ],
          "title": "CPU throttling (CFS periods throttled)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0, "min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 33},
          "id": 11,
          "targets": [
            {"expr": "count(nexus_service_info{service_name=\"checkout-service\"})", "legendFormat": "checkout replicas", "refId": "A"},
            {"expr": "count(nexus_service_info{service_name=\"payment-service\"})", "legendFormat": "payment replicas", "refId": "B"}
          ],
          "title": "Replicas: checkout and payment",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["nexus", "m1", "p0"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "timezone": "browser",
      "title": "NEXUS M1 Service Overview",
      "uid": "nexus-m1-overview",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: nexus-demo
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/nexus-m1-overview.json"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-m1
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: nexus-demo
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana
