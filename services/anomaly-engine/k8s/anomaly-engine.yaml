apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-engine
  namespace: nexus-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-engine
  template:
    metadata:
      labels:
        app: anomaly-engine
        service_name: anomaly-engine
    spec:
      automountServiceAccountToken: false
      containers:
        - name: anomaly-engine
          image: nexus/anomaly-engine:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: SERVICE_NAME
              value: anomaly-engine
            - name: SERVICE_VERSION
              value: 0.1.0
            - name: ENVIRONMENT
              value: integration
            - name: M2_POLL_ENABLED
              value: "true"
            - name: M2_HANDOFF_ENABLED
              value: "true"
            - name: M2_HANDOFF_URL
              value: http://shared-nexus-api:8004
            - name: M1_TELEMETRY_BASE_URL
              value: http://telemetry-intelligence:8001
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-engine
  namespace: nexus-demo
spec:
  selector:
    app: anomaly-engine
  ports:
    - name: http
      port: 8002
      targetPort: http
