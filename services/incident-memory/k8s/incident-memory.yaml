apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-memory
  namespace: nexus-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: incident-memory
  template:
    metadata:
      labels:
        app: incident-memory
        service_name: incident-memory
    spec:
      automountServiceAccountToken: false
      containers:
        - name: incident-memory
          image: nexus/incident-memory:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: SERVICE_NAME
              value: incident-memory
            - name: ENVIRONMENT
              value: development
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-runtime
                  key: DATABASE_URL
            - name: M5_UI_MODE
              value: live
            - name: SHARED_NEXUS_API_BASE_URL
              value: http://shared-nexus-api:8004
            - name: M5_INCIDENT_DETAIL_PATH
              value: /api/incidents/{incident_id}/context
            - name: M5_APPROVE_PATH
              value: /api/incidents/{incident_id}/approve
            - name: M5_REJECT_PATH
              value: /api/incidents/{incident_id}/reject
            - name: M5_SHARED_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexus-runtime
                  key: NEXUS_APPROVAL_TOKEN
            - name: M5_OPERATOR_ID
              valueFrom:
                secretKeyRef:
                  name: nexus-runtime
                  key: M5_OPERATOR_ID
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: incident-memory
  namespace: nexus-demo
spec:
  selector:
    app: incident-memory
  ports:
    - name: http
      port: 8005
      targetPort: http
