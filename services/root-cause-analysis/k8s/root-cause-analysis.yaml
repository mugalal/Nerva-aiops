apiVersion: apps/v1
kind: Deployment
metadata:
  name: root-cause-analysis
  namespace: nexus-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: root-cause-analysis
  template:
    metadata:
      labels:
        app: root-cause-analysis
        service_name: root-cause-analysis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: root-cause-analysis
          image: nexus/root-cause-analysis:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: SERVICE_NAME
              value: root-cause-analysis
            - name: SERVICE_VERSION
              value: 0.1.0
            - name: ENVIRONMENT
              value: integration
            - name: M3_PROVIDER_MODE
              value: real
            - name: M1_TELEMETRY_BASE_URL
              value: http://telemetry-intelligence:8001
            - name: SHARED_NEXUS_API_BASE_URL
              value: http://shared-nexus-api:8004
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: root-cause-analysis
  namespace: nexus-demo
spec:
  selector:
    app: root-cause-analysis
  ports:
    - name: http
      port: 8003
      targetPort: http
