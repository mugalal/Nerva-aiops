apiVersion: v1
kind: ServiceAccount
metadata:
  name: shared-nexus-api
  namespace: nexus-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: approved-remediation
  namespace: nexus-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["payment-service"]
    verbs: ["get", "list", "patch", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["payment-service"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # M4 checks whether an HPA owns the workload before scaling (M4_HPA_POLICY);
  # patch is used only by M4_HPA_POLICY=raise-min.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: approved-remediation
  namespace: nexus-demo
subjects:
  - kind: ServiceAccount
    name: shared-nexus-api
    namespace: nexus-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: approved-remediation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-nexus-api
  namespace: nexus-demo
spec:
  # Leader election (app/orchestration/leadership.py): extra replicas wait as
  # standbys (live, not ready) and take over within M4_LEADER_RETRY_SECONDS of
  # the leader's database session ending. 1 keeps the demo footprint small.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shared-nexus-api
  template:
    metadata:
      labels:
        app: shared-nexus-api
        service_name: shared-nexus-api
    spec:
      serviceAccountName: shared-nexus-api
      containers:
        - name: shared-nexus-api
          image: nexus/shared-nexus-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          env:
            - name: RCA_PROVIDER
              value: real
            - name: FINOPS_PROVIDER
              value: real
            - name: EVIDENCE_PROVIDER
              value: real
            - name: RECOVERY_PROVIDER
              value: real
            - name: RECOVERY_TIMEOUT_SECONDS
              value: "360"
            - name: REMEDIATION_BACKEND
              value: kubernetes
            - name: M3_RCA_URL
              value: http://root-cause-analysis:8003/internal/rca/analyze
            - name: M6_FINOPS_URL
              value: http://finops-engine:8006/internal/finops/context
            - name: M1_EVIDENCE_URL
              value: http://telemetry-intelligence:8001/internal/evidence/capture
            - name: M1_RECOVERY_URL
              value: http://telemetry-intelligence:8001/internal/recovery/validate
            - name: ENVIRONMENT
              value: development
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexus-runtime
                  key: DATABASE_URL
            - name: NEXUS_APPROVAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexus-runtime
                  key: NEXUS_APPROVAL_TOKEN
            - name: NEXUS_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexus-runtime
                  key: NEXUS_INGEST_TOKEN
            - name: NEXUS_SERVICES_CONFIG
              value: /app/config/services.yaml
            - name: M4_WORKER_CONCURRENCY
              value: "4"
            # Diagnose only once M1's one-minute windows show the fault fully.
            - name: M4_AUTO_BUILD_DELAY_SECONDS
              value: "60"
            - name: M5_MEMORY_BASE_URL
              value: http://incident-memory:8005
            - name: M4_AUTO_VALIDATE_RECOVERY
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 8
          livenessProbe:
            # /live has no dependency I/O: a database or M3 outage never restarts the pod,
            # but a lost writer lease does.
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shared-nexus-api
  namespace: nexus-demo
spec:
  selector:
    app: shared-nexus-api
  ports:
    - name: http
      port: 8004
      targetPort: http
