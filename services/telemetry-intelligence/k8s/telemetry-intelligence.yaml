apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-intelligence
  namespace: nexus-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: telemetry-evidence-reader
  namespace: nexus-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: telemetry-evidence-reader
  namespace: nexus-demo
subjects:
  - kind: ServiceAccount
    name: telemetry-intelligence
    namespace: nexus-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: telemetry-evidence-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-intelligence
  namespace: nexus-demo
  labels:
    app: telemetry-intelligence
    service_name: telemetry-intelligence
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telemetry-intelligence
  template:
    metadata:
      labels:
        app: telemetry-intelligence
        service_name: telemetry-intelligence
        version: 0.1.0
        environment: development
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: telemetry-intelligence
      containers:
        - name: telemetry-intelligence
          image: nexus/telemetry-intelligence:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: SERVICE_NAME
              value: telemetry-intelligence
            - name: SERVICE_VERSION
              value: 0.1.0
            - name: ENVIRONMENT
              value: development
            - name: M1_PROVIDER_MODE
              value: real
            - name: M1_KUBERNETES_NAMESPACE
              value: nexus-demo
            - name: PROMETHEUS_BASE_URL
              value: http://prometheus:9090
            - name: LOKI_BASE_URL
              value: http://loki:3100
            - name: PAYMENT_SERVICE_BASE_URL
              value: http://payment-service
            - name: M1_DATA_DIR
              value: /data
            - name: M1_REQUEST_RATE_WINDOW
              value: 1m
            - name: M1_LATENCY_WINDOW
              value: 1m
            - name: CPU_LIMIT_CORES
              value: "0.5"
            - name: MEMORY_LIMIT_BYTES
              value: "536870912"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: evidence
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: m1-evidence-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: m1-evidence-data
  namespace: nexus-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-intelligence
  namespace: nexus-demo
spec:
  selector:
    app: telemetry-intelligence
  ports:
    - name: http
      port: 8001
      targetPort: http
