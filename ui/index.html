<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS | Operations</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body>
<header><div><span class="brand">NEXUS</span><span class="subtitle">Incident intelligence</span></div><span id="mode" class="badge">Connecting</span></header>
<div class="layout"><nav aria-label="Main navigation">
<button data-view="overview" class="active">Overview</button><button data-view="incident">Incident Center</button><button data-view="finops">FinOps Summary</button><button data-view="copilot">Copilot</button>
<p>Observe. Understand.<br>Act. Validate. Learn.</p></nav>
<main><div class="toolbar"><div><small>OPERATIONS WORKSPACE</small><h1 id="title">Overview</h1></div><button id="refresh">Refresh</button></div>
<div id="notice" role="status" hidden></div>
<section id="overview" class="view"><div id="summary" class="cards"></div><h2>Incidents</h2><div id="incidents"></div></section>
<section id="incident" class="view" hidden><label for="incident-select">Select incident</label><select id="incident-select"></select><div id="incident-body"></div></section>
<section id="finops" class="view" hidden><p class="muted">Resource observations and estimated cost options for the selected incident.</p><div id="finops-body"></div></section>
<section id="copilot" class="view" hidden><p class="muted">Answers use the selected incident's stored records. Each claim includes its source.</p><div id="question-buttons"></div><form id="query-form"><label for="question">Operational question</label><div class="query"><input id="question" required maxlength="2000" placeholder="What is the root cause?"><button>Ask Copilot</button></div></form><div id="answer" aria-live="polite"></div></section>
</main></div><script type="module" src="/assets/app.js"></script>
</body></html>
